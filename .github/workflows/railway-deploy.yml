name: Deploy to Railway

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  NODE_VERSION: 20

jobs:
  # Test and Build Job
  test-and-build:
    name: Test & Build
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build packages
      run: |
        npm run build --workspace=@urfmp/types
        npm run build --workspace=@urfmp/sdk

    - name: Run tests
      run: |
        npm run test --workspace=@urfmp/types
        npm run test --workspace=@urfmp/sdk
        npm run test --workspace=@urfmp/api
        npm run test --workspace=@urfmp/web

    - name: Run linting
      run: npm run lint --workspace=@urfmp/web

    - name: TypeScript check
      run: npm run typecheck --workspace=@urfmp/web

  # Deploy to Railway (only on main branch)
  deploy:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    needs: test-and-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Install Railway CLI
      run: npm install -g @railway/cli

    - name: Deploy to Railway
      run: railway up --service ${{ secrets.RAILWAY_SERVICE_ID }}
      env:
        RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

    - name: Post deployment status
      if: always()
      run: |
        if [ ${{ job.status }} == 'success' ]; then
          echo "🚀 Deployment successful!"
        else
          echo "❌ Deployment failed"
          exit 1
        fi