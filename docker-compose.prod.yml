version: '3.8'

services:
  postgres:
    image: timescale/timescaledb:latest-pg15
    container_name: urfmp-postgres
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-urfmp}
      POSTGRES_USER: ${DATABASE_USER:-urfmp}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-urfmp-production-2024}
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DATABASE_USER:-urfmp}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: urfmp-redis
    ports:
      - '6379:6379'
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: urfmp-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-urfmp}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-urfmp-production-2024}
    ports:
      - '5672:5672' # AMQP
      - '15672:15672' # Management UI
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # API Service
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile.prod
    container_name: urfmp-api
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${DATABASE_USER:-urfmp}:${DATABASE_PASSWORD:-urfmp-production-2024}@postgres:5432/${DATABASE_NAME:-urfmp}
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-urfmp}:${RABBITMQ_PASSWORD:-urfmp-production-2024}@rabbitmq:5672
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      PORT: 3000
    depends_on:
      - postgres
      - redis
      - rabbitmq
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/health']
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Web Frontend
  web:
    build:
      context: .
      dockerfile: web/Dockerfile.prod
    container_name: urfmp-web
    ports:
      - '3001:3001'
    environment:
      NODE_ENV: production
      VITE_DEMO_MODE: "true"
      VITE_URFMP_API_KEY: ${VITE_URFMP_API_KEY:-urfmp_dev_9f8e7d6c5b4a3910efabcdef12345678}
      VITE_URFMP_API_URL: ""
      VITE_URFMP_WS_URL: ""
      VITE_COMPANY_NAME: URFMP
      VITE_PRODUCT_NAME: URFMP
      VITE_PRODUCT_FULL_NAME: "Universal Robot Fleet Management Platform"
      VITE_TAGLINE: "The Stripe of Robotics"
      VITE_DESCRIPTION: "Monitor any robot in 7 lines of code"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:

networks:
  default:
    name: urfmp-production
    driver: bridge