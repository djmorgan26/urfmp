# Railway Configuration for API Service
[build]
builder = "dockerfile"
dockerfilePath = "services/api/Dockerfile.prod"
watchPaths = ["services/api/**", "packages/**", "railway.toml"]

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "on_failure"
startCommand = "npx tsx services/api/src/index.ts"